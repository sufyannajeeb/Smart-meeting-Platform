{% extends "base.html" %}
{% block title %}Register — SmartMeet AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="mb-3">Create account</h2>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              <input type="{% if 'password' in field.name %}password{% else %}text{% endif %}"
                     name="{{ field.name }}" class="form-control" value="{{ field.value|default:'' }}">
              {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100" type="submit">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center small">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
